# ========================================================================
# TEST URLS WORKFLOW - car-automotive
# RULE 50b: Essential debug workflow for URL accessibility testing
# Generated by Opsera Code-to-Cloud Enterprise v0.914
# ========================================================================

name: "Debug: Test URLs car-automotive"

on:
  workflow_dispatch:

env:
  APP_NAME: car-automotive
  TENANT: opsera
  DOMAIN: agent.opsera.dev

jobs:
  test-urls:
    name: "Test URLs"
    runs-on: ubuntu-latest
    steps:
      - name: Test DEV URL
        run: |
          URL="https://${{ env.TENANT }}-${{ env.APP_NAME }}-dev.${{ env.DOMAIN }}"

          echo "### URL Accessibility Test" | tee -a $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | URL | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------------|-----|--------|" >> $GITHUB_STEP_SUMMARY

          echo "Testing: $URL"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL" --max-time 10 || echo "000")
          echo "HTTP Status: $STATUS"
          if [ "$STATUS" = "200" ] || [ "$STATUS" = "301" ] || [ "$STATUS" = "302" ]; then
            echo "| DEV | $URL | $STATUS |" >> $GITHUB_STEP_SUMMARY
            echo "Result: SUCCESS"
          else
            echo "| DEV | $URL | $STATUS (FAILED) |" >> $GITHUB_STEP_SUMMARY
            echo "Result: FAILED"
          fi
