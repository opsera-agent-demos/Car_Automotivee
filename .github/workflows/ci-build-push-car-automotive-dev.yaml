# ========================================================================
# CI BUILD & PUSH - car-automotive DEV Environment
# RULE 127: Run ONLY AFTER bootstrap-infrastructure workflow completes
# Generated by Opsera Code-to-Cloud Enterprise v0.914
# ========================================================================

name: "car-automotive: CI Build & Push (DEV)"

on:
  push:
    branches: [main, car-automotive]
    paths:
      - 'frontend/**'
      - 'backend/**'
      - '.opsera-car-automotive/**'
  workflow_dispatch:
    inputs:
      security_scan_mode:
        description: 'Security scan behavior'
        type: choice
        options: ['fail', 'warn', 'skip']
        default: 'warn'

env:
  APP_NAME: car-automotive
  TENANT: opsera
  ENVIRONMENT: dev
  AWS_REGION: us-west-2
  HUB_CLUSTER: argocd-usw2
  SPOKE_CLUSTER: opsera-usw2-np
  DOMAIN: agent.opsera.dev

permissions:
  contents: write
  id-token: write
  security-events: write

jobs:
  configure:
    name: "Configure Pipeline"
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.config.outputs.image_tag }}
      security_scan_mode: ${{ steps.config.outputs.security_scan_mode }}
    steps:
      - name: Set Configuration
        id: config
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          TIMESTAMP=$(date +%Y%m%d%H%M%S)
          echo "image_tag=${SHORT_SHA}-${TIMESTAMP}" >> $GITHUB_OUTPUT

          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "security_scan_mode=${{ inputs.security_scan_mode }}" >> $GITHUB_OUTPUT
          else
            echo "security_scan_mode=warn" >> $GITHUB_OUTPUT
          fi

          echo "### Pipeline Configuration" >> $GITHUB_STEP_SUMMARY
          echo "| Setting | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | dev |" >> $GITHUB_STEP_SUMMARY
          echo "| Image Tag | ${SHORT_SHA}-${TIMESTAMP} |" >> $GITHUB_STEP_SUMMARY

  security-gitleaks:
    name: "Gitleaks Secret Scan"
    runs-on: ubuntu-latest
    needs: configure
    if: needs.configure.outputs.security_scan_mode != 'skip'
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-frontend:
    name: "Build Frontend"
    runs-on: ubuntu-latest
    needs: [configure, security-gitleaks]
    if: always() && !contains(needs.security-gitleaks.result, 'failure')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        run: |
          aws ecr get-login-password --region ${{ env.AWS_REGION }} | \
            docker login --username AWS --password-stdin $(aws sts get-caller-identity --query Account --output text).dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com

      # RULE 147: Get AWS Account ID dynamically in EACH job
      - name: Get AWS Account ID
        id: account
        run: |
          AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "account_id=${AWS_ACCOUNT_ID}" >> $GITHUB_OUTPUT

      - name: Copy Dockerfile and nginx config
        run: |
          cp .opsera-${{ env.APP_NAME }}/Dockerfiles/Dockerfile.frontend frontend/Dockerfile.opsera
          cp .opsera-${{ env.APP_NAME }}/nginx.conf frontend/nginx.conf

      - name: Build Frontend Image
        id: build
        run: |
          ECR_URI="${{ steps.account.outputs.account_id }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com"
          IMAGE="${ECR_URI}/${{ env.TENANT }}/${{ env.APP_NAME }}-frontend:${{ needs.configure.outputs.image_tag }}"

          cd frontend
          docker build -f Dockerfile.opsera -t $IMAGE .

          echo "image=${IMAGE}" >> $GITHUB_OUTPUT
          echo "Frontend image built: $IMAGE"

      # RULE 129: Grype scan AFTER build, BEFORE push
      - name: Run Grype Security Scan
        if: needs.configure.outputs.security_scan_mode != 'skip'
        uses: anchore/scan-action@v3
        id: grype
        with:
          image: ${{ steps.build.outputs.image }}
          fail-build: false
          severity-cutoff: high
          output-format: sarif
        continue-on-error: true

      - name: Push Frontend Image
        run: |
          docker push ${{ steps.build.outputs.image }}
          echo "Frontend image pushed"

  build-backend:
    name: "Build Backend"
    runs-on: ubuntu-latest
    needs: [configure, security-gitleaks]
    if: always() && !contains(needs.security-gitleaks.result, 'failure')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        run: |
          aws ecr get-login-password --region ${{ env.AWS_REGION }} | \
            docker login --username AWS --password-stdin $(aws sts get-caller-identity --query Account --output text).dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com

      # RULE 147: Get AWS Account ID dynamically in EACH job
      - name: Get AWS Account ID
        id: account
        run: |
          AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "account_id=${AWS_ACCOUNT_ID}" >> $GITHUB_OUTPUT

      - name: Copy Dockerfile
        run: |
          cp .opsera-${{ env.APP_NAME }}/Dockerfiles/Dockerfile.backend backend/Dockerfile.opsera

      - name: Build Backend Image
        id: build
        run: |
          ECR_URI="${{ steps.account.outputs.account_id }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com"
          IMAGE="${ECR_URI}/${{ env.TENANT }}/${{ env.APP_NAME }}-backend:${{ needs.configure.outputs.image_tag }}"

          cd backend
          docker build -f Dockerfile.opsera -t $IMAGE .

          echo "image=${IMAGE}" >> $GITHUB_OUTPUT
          echo "Backend image built: $IMAGE"

      # RULE 129: Grype scan AFTER build, BEFORE push
      - name: Run Grype Security Scan
        if: needs.configure.outputs.security_scan_mode != 'skip'
        uses: anchore/scan-action@v3
        id: grype
        with:
          image: ${{ steps.build.outputs.image }}
          fail-build: false
          severity-cutoff: high
          output-format: sarif
        continue-on-error: true

      - name: Push Backend Image
        run: |
          docker push ${{ steps.build.outputs.image }}
          echo "Backend image pushed"

  update-manifests:
    name: "Update Manifests"
    runs-on: ubuntu-latest
    needs: [configure, build-frontend, build-backend]
    if: always() && needs.build-frontend.result == 'success' && needs.build-backend.result == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # RULE 147: Get AWS Account ID dynamically
      - name: Get AWS Account ID
        id: account
        run: |
          AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "account_id=${AWS_ACCOUNT_ID}" >> $GITHUB_OUTPUT

      - name: Update Kustomization
        run: |
          cd .opsera-${{ env.APP_NAME }}/k8s/overlays/${{ env.ENVIRONMENT }}

          # RULE 147: Construct ECR URI dynamically
          ECR_URI="${{ steps.account.outputs.account_id }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com"
          IMAGE_TAG="${{ needs.configure.outputs.image_tag }}"

          # RULE 131: Replace PLACEHOLDER_ECR_URI with actual ECR URI
          if grep -q "PLACEHOLDER_ECR_URI" kustomization.yaml; then
            echo "Replacing PLACEHOLDER_ECR_URI with actual ECR URI"
            sed -i "s|PLACEHOLDER_ECR_URI|${ECR_URI}|g" kustomization.yaml
          fi

          # Update image tags
          sed -i "s|newTag:.*frontend.*|newTag: ${IMAGE_TAG}|g" kustomization.yaml || true
          sed -i "s|newTag: latest|newTag: ${IMAGE_TAG}|g" kustomization.yaml

          echo "Updated kustomization.yaml:"
          cat kustomization.yaml

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .opsera-${{ env.APP_NAME }}/k8s/overlays/${{ env.ENVIRONMENT }}

          # RULE 143: Pull FIRST, then commit/push
          git pull --rebase origin ${{ github.ref_name }} || true

          git commit -m "deploy(dev): Update image to ${{ needs.configure.outputs.image_tag }} [skip ci]" || echo "No changes to commit"
          git push origin ${{ github.ref_name }}

  sync-argocd:
    name: "Sync ArgoCD"
    runs-on: ubuntu-latest
    needs: [configure, update-manifests]
    if: always() && needs.update-manifests.result == 'success'
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/v1.28.0/bin/linux/amd64/kubectl"
          chmod +x kubectl && sudo mv kubectl /usr/local/bin/

      - name: Update Kubeconfig
        run: |
          aws eks update-kubeconfig --name ${{ env.HUB_CLUSTER }} --region ${{ env.AWS_REGION }}

      # RULE 93: Use kubectl, NOT argocd CLI
      - name: Trigger ArgoCD Sync
        run: |
          kubectl annotate application ${{ env.APP_NAME }}-${{ env.ENVIRONMENT }} -n argocd \
            argocd.argoproj.io/refresh=hard --overwrite
          echo "ArgoCD sync triggered"

      - name: Wait for Sync
        run: |
          echo "Waiting for ArgoCD to sync..."
          for i in {1..30}; do
            SYNC_STATUS=$(kubectl get application ${{ env.APP_NAME }}-${{ env.ENVIRONMENT }} -n argocd -o jsonpath='{.status.sync.status}' 2>/dev/null || echo "Unknown")
            HEALTH_STATUS=$(kubectl get application ${{ env.APP_NAME }}-${{ env.ENVIRONMENT }} -n argocd -o jsonpath='{.status.health.status}' 2>/dev/null || echo "Unknown")

            echo "Sync: $SYNC_STATUS, Health: $HEALTH_STATUS"

            if [ "$SYNC_STATUS" == "Synced" ] && [ "$HEALTH_STATUS" == "Healthy" ]; then
              echo "Deployment successful!"
              exit 0
            fi

            sleep 10
          done

          echo "Deployment status: Sync=$SYNC_STATUS, Health=$HEALTH_STATUS"
          echo "Check ArgoCD for details"

  summary:
    name: "Pipeline Summary"
    runs-on: ubuntu-latest
    needs: [configure, build-frontend, build-backend, update-manifests, sync-argocd]
    if: always()
    steps:
      - name: Generate Summary
        run: |
          echo "# Deployment Summary: ${{ env.APP_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Stage | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Build Frontend | ${{ needs.build-frontend.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build Backend | ${{ needs.build-backend.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Update Manifests | ${{ needs.update-manifests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| ArgoCD Sync | ${{ needs.sync-argocd.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Details" >> $GITHUB_STEP_SUMMARY
          echo "- Image Tag: \`${{ needs.configure.outputs.image_tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Environment: dev" >> $GITHUB_STEP_SUMMARY
          echo "- URL: https://${{ env.TENANT }}-${{ env.APP_NAME }}-dev.${{ env.DOMAIN }}" >> $GITHUB_STEP_SUMMARY
