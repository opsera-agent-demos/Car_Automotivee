# ========================================================================
# ARGOCD SYNC WORKFLOW - car-automotive
# RULE 50b: Essential debug workflow for forcing ArgoCD sync
# Generated by Opsera Code-to-Cloud Enterprise v0.914
# ========================================================================

name: "Debug: ArgoCD Sync car-automotive"

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options: [dev]
        default: dev

env:
  APP_NAME: car-automotive
  AWS_REGION: us-west-2
  HUB_CLUSTER: argocd-usw2

permissions:
  contents: read
  id-token: write

jobs:
  sync:
    name: "Force ArgoCD Sync"
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/v1.28.0/bin/linux/amd64/kubectl"
          chmod +x kubectl && sudo mv kubectl /usr/local/bin/

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig --name ${{ env.HUB_CLUSTER }} --region ${{ env.AWS_REGION }}

      # RULE 93: Use kubectl, NOT argocd CLI
      - name: Force Sync
        run: |
          APP_NAME="${{ env.APP_NAME }}-${{ inputs.environment }}"

          echo "Forcing ArgoCD sync for: $APP_NAME"

          kubectl annotate application $APP_NAME -n argocd \
            argocd.argoproj.io/refresh=hard --overwrite

          echo "### ArgoCD Sync Triggered" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Application: $APP_NAME" >> $GITHUB_STEP_SUMMARY

      - name: Check Status
        run: |
          APP_NAME="${{ env.APP_NAME }}-${{ inputs.environment }}"
          sleep 10

          SYNC=$(kubectl get application $APP_NAME -n argocd -o jsonpath='{.status.sync.status}')
          HEALTH=$(kubectl get application $APP_NAME -n argocd -o jsonpath='{.status.health.status}')

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Sync Status | $SYNC |" >> $GITHUB_STEP_SUMMARY
          echo "| Health Status | $HEALTH |" >> $GITHUB_STEP_SUMMARY
