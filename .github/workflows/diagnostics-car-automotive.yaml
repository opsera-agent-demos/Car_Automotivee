# ========================================================================
# DIAGNOSTICS WORKFLOW - car-automotive
# RULE 50: Full pipeline debugging for troubleshooting
# Generated by Opsera Code-to-Cloud Enterprise v0.914
# ========================================================================

name: "Diagnostics: car-automotive"

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options: [dev]
        default: dev

env:
  APP_NAME: car-automotive
  TENANT: opsera
  AWS_REGION: us-west-2
  HUB_CLUSTER: argocd-usw2
  SPOKE_CLUSTER: opsera-usw2-np
  DOMAIN: agent.opsera.dev

permissions:
  contents: read
  id-token: write

jobs:
  diagnostics:
    name: "Full Pipeline Diagnostics"
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/v1.28.0/bin/linux/amd64/kubectl"
          chmod +x kubectl && sudo mv kubectl /usr/local/bin/

      - name: "Stage 1 - ECR Check"
        run: |
          echo "### Stage 1: ECR Repositories" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          for COMPONENT in frontend backend; do
            REPO="${{ env.TENANT }}/${{ env.APP_NAME }}-${COMPONENT}"
            if aws ecr describe-repositories --repository-names $REPO &>/dev/null; then
              echo "- ECR $COMPONENT: EXISTS" >> $GITHUB_STEP_SUMMARY
              echo "  Latest images:" >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              aws ecr describe-images --repository-name $REPO \
                --query 'imageDetails[*].[imageTags[0],imagePushedAt]' \
                --output table 2>/dev/null | head -10 >> $GITHUB_STEP_SUMMARY || echo "No images" >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
            else
              echo "- ECR $COMPONENT: NOT FOUND" >> $GITHUB_STEP_SUMMARY
            fi
          done

      - name: "Stage 2 - EKS/Namespace Check"
        run: |
          aws eks update-kubeconfig --name ${{ env.SPOKE_CLUSTER }} --region ${{ env.AWS_REGION }}

          NAMESPACE="${{ env.TENANT }}-${{ env.APP_NAME }}-${{ inputs.environment }}"
          echo "### Stage 2: EKS Namespace" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if kubectl get namespace $NAMESPACE &>/dev/null; then
            echo "- Namespace: EXISTS" >> $GITHUB_STEP_SUMMARY
          else
            echo "- Namespace: NOT FOUND" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Pods:**" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          kubectl get pods -n $NAMESPACE -o wide 2>/dev/null >> $GITHUB_STEP_SUMMARY || echo "No pods found" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Services:**" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          kubectl get svc -n $NAMESPACE 2>/dev/null >> $GITHUB_STEP_SUMMARY || echo "No services" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Ingress:**" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          kubectl get ingress -n $NAMESPACE 2>/dev/null >> $GITHUB_STEP_SUMMARY || echo "No ingress" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: "Stage 3 - ArgoCD Status"
        run: |
          aws eks update-kubeconfig --name ${{ env.HUB_CLUSTER }} --region ${{ env.AWS_REGION }}

          echo "### Stage 3: ArgoCD Application" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          APP_NAME="${{ env.APP_NAME }}-${{ inputs.environment }}"
          if kubectl get application $APP_NAME -n argocd &>/dev/null; then
            SYNC=$(kubectl get application $APP_NAME -n argocd -o jsonpath='{.status.sync.status}')
            HEALTH=$(kubectl get application $APP_NAME -n argocd -o jsonpath='{.status.health.status}')
            echo "- Application: EXISTS" >> $GITHUB_STEP_SUMMARY
            echo "- Sync Status: $SYNC" >> $GITHUB_STEP_SUMMARY
            echo "- Health Status: $HEALTH" >> $GITHUB_STEP_SUMMARY
          else
            echo "- Application: NOT FOUND" >> $GITHUB_STEP_SUMMARY
          fi

      - name: "Stage 4 - Health Check"
        run: |
          echo "### Stage 4: Health Endpoints" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          URL="https://${{ env.TENANT }}-${{ env.APP_NAME }}-${{ inputs.environment }}.${{ env.DOMAIN }}"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL" --max-time 10 || echo "000")

          echo "- URL: $URL" >> $GITHUB_STEP_SUMMARY
          echo "- HTTP Status: $STATUS" >> $GITHUB_STEP_SUMMARY

          if [ "$STATUS" = "200" ] || [ "$STATUS" = "301" ] || [ "$STATUS" = "302" ]; then
            echo "- Result: HEALTHY" >> $GITHUB_STEP_SUMMARY
          else
            echo "- Result: UNHEALTHY or UNREACHABLE" >> $GITHUB_STEP_SUMMARY
          fi
