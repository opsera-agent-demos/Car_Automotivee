apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: opsera-car-automotive-dev

resources:
  - ../../base
  - namespace.yaml

# RULE 106: Use labels with includeSelectors: false, NOT commonLabels
labels:
  - pairs:
      environment: dev
    includeSelectors: false

images:
  - name: car-automotive-frontend
    newName: 792373136340.dkr.ecr.us-west-2.amazonaws.com/opsera/car-automotive-frontend
    newTag: 3487d14-20260205050435
  - name: car-automotive-backend
    newName: 792373136340.dkr.ecr.us-west-2.amazonaws.com/opsera/car-automotive-backend
    newTag: 3487d14-20260205050435

patches:
  # Update ingress host for dev environment
  - target:
      kind: Ingress
      name: car-automotive
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: opsera-car-automotive-dev.agent.opsera.dev
