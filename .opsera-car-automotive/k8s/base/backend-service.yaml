apiVersion: v1
kind: Service
metadata:
  name: car-automotive-backend
  labels:
    app: car-automotive
    component: backend
spec:
  type: ClusterIP
  ports:
    - port: 8080
      # RULE 130c: targetPort must match container port (8080)
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    app: car-automotive
    component: backend
