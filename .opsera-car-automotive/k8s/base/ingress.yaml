apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: car-automotive
  labels:
    app: car-automotive
  annotations:
    # RULE 105: Both annotation and ingressClassName required for NGINX compatibility
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    # RULE 104: NO cert-manager annotations - TLS handled at controller level
spec:
  # RULE 105: Both ingressClassName and annotation required
  ingressClassName: nginx
  # RULE 104: NO spec.tls section - TLS handled at Ingress Controller level
  rules:
    - host: PLACEHOLDER_SUBDOMAIN
      http:
        paths:
          # Frontend serves the app and proxies /api to backend
          - path: /
            pathType: Prefix
            backend:
              service:
                name: car-automotive-frontend
                port:
                  number: 80
