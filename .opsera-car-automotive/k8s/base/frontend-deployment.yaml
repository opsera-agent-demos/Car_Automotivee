apiVersion: apps/v1
kind: Deployment
metadata:
  name: car-automotive-frontend
  labels:
    app: car-automotive
    component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: car-automotive
      component: frontend
  template:
    metadata:
      labels:
        app: car-automotive
        component: frontend
    spec:
      containers:
        - name: frontend
          image: car-automotive-frontend:latest
          ports:
            # RULE 74b: Port 8080 for non-root containers
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
